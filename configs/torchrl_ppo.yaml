# Defaults for scripts/train_torchrl.py -- every key can be overridden on the CLI.
env_id: MujocoArm3Reach-v1
total_frames: 300000
frames_per_batch: 2000    # 40 episodes of 50 steps per PPO update
sub_batch_size: 250
num_epochs: 10

lr: 0.0003
hidden: 256
gamma: 0.95               # 25 Hz -> ~0.8 s effective horizon
lmbda: 0.95
clip_epsilon: 0.2
entropy_eps: 0.0001
max_grad_norm: 1.0

eval_every: 10            # batches between held-out evaluations (best one is kept)
eval_cases: 30

seed: 0
threads: 0
device: cpu               # the nets are tiny; CPU is the right call
