# Defaults for scripts/train_torchrl.py -- every key can be overridden on the CLI.
total_frames: 200000
frames_per_batch: 2000
sub_batch_size: 250
num_epochs: 10

lr: 0.0003
hidden: 256
gamma: 0.98
lmbda: 0.95
clip_epsilon: 0.2
entropy_eps: 0.0001
max_grad_norm: 1.0

seed: 0
device: cpu               # "cuda" if you have a GPU; this net is tiny, CPU is fine
