name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (env + tests only, no heavy RL deps)
        run: |
          python -m pip install --upgrade pip
          pip install mujoco gymnasium numpy pyyaml pytest ruff

      - name: Lint
        run: ruff check src scripts tests

      - name: Test environment
        env:
          MUJOCO_GL: disable
        run: pytest -q

      - name: Smoke-test the random-policy rollout
        env:
          MUJOCO_GL: disable
        run: python scripts/view_random.py --headless --episodes 1
